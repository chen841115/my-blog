{{ with site.Data.now.ticker }}

<aside class="sidebar-status-rotator"
       data-status-rotator>

    <div class="sidebar-status-rotator__title">
        <span class="sidebar-status-rotator__dot"></span>
        最近
    </div>

    <div class="sidebar-status-rotator__viewport">

        {{ range $index, $item := . }}
        <div class="sidebar-status-rotator__item
                    {{ if eq $index 0 }}is-active{{ end }}">
            {{ $item.text }}
        </div>
        {{ end }}

    </div>

    <div class="sidebar-status-rotator__footer">

        <div class="sidebar-status-rotator__indicator">
            {{ range $index, $_ := . }}
                <span class="sidebar-status-rotator__indicator-dot
                             {{ if eq $index 0 }}is-active{{ end }}">
                </span>
            {{ end }}
        </div>

        <a href="{{ "/now/" | relURL }}"
           class="sidebar-status-rotator__more">
            看完整近況 →
        </a>

    </div>

</aside>


<script>
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("[data-status-rotator]").forEach((rotator) => {

        const items = rotator.querySelectorAll(
            ".sidebar-status-rotator__item"
        );

        const dots = rotator.querySelectorAll(
            ".sidebar-status-rotator__indicator-dot"
        );

        if (items.length <= 1) return;

        let current = 0;

        const showItem = (next) => {
            items[current].classList.remove("is-active");
            dots[current]?.classList.remove("is-active");

            current = next;

            items[current].classList.add("is-active");
            dots[current]?.classList.add("is-active");
        };

        if (
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        ) {
            return;
        }

        setInterval(() => {
            showItem((current + 1) % items.length);
        }, 4500);

    });
});
</script>

{{ end }}
